<!DOCTYPE html>
<html lang="en">

<head>

  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- SEO -->

  <!-- Open Graph -->
  <meta property="og:title" content="Jungle Resort Patna - Waterpark &amp; Wedding Venue" />

    content="Best Jungle Resort &amp; Waterpark in Patna for weddings, parties &amp; family fun." />
  <meta property="og:image" content="https://jungleresortpatna.in/logo-red-yellow.png" />

  <meta property="og:site_name" content="Jungle Resort Patna" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:description" content="Best Jungle Resort &amp; Waterpark in Patna for weddings, parties &amp; family fun." />
  <meta name="twitter:image" content="https://jungleresortpatna.in/logo-red-yellow.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts: fully non-blocking — media=print trick, swap to all onload -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap"
    media="print" onload="this.media='all'" />

  <!-- Font Awesome removed — WhatsApp icon now uses inline SVG (no 3rd-party CSS needed) -->

  <!-- LCP image preload — must match src in hero-section.jsx exactly -->
  <link rel="preload" as="image" href="%PUBLIC_URL%/videos/hero.webp"
    type="image/webp" fetchpriority="high" />

  <!-- Razorpay loaded dynamically only in Checkout page — not globally -->

  <!-- Critical inline CSS: prevent invisible text + reserve LCP space -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: Georgia, 'Times New Roman', serif;
      background: #faf8f3;
    }
    #root { min-height: 100vh; }
    /* Reserve hero min-height so LCP image has space immediately */
    .heroSection, [class*="heroSection"] {
      min-height: 100vh;
      background: #1a1a1a;
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- Structured Data: LocalBusiness Schema for SEO -->
  <script type="application/ld+json">

</body>

</html>
